<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1628">
<meta name="apple-mobile-web-app-title" content="업무교육">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>매장업무교육</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213d; --navy2:#1f3160; --gold:#c9a24a; --bg:#f4f3ef; --card:#fff;
  --ink:#1b1b1f; --sub:#6b6f7a; --line:#e4e2db;
  --hall:#2f7d5b; --hallbg:#e5f3ec; --kit:#c2531f; --kitbg:#fbeadf; --com:#4a5bb5; --combg:#e8ebfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:110px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.5px}
.brand h1 small{display:block;font-size:11px;font-weight:500;color:var(--gold);letter-spacing:1.5px;margin-bottom:2px}
.hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.hbtn.on{background:var(--gold);color:var(--navy)}
.search{margin-top:12px;position:relative}
.search input{width:100%;border:0;border-radius:14px;padding:14px 44px 14px 44px;font-size:16px;background:#fff;color:var(--ink);outline:none}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#e9e9ee;border-radius:50%;width:30px;height:30px;font-size:15px;display:none}
.quick{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.quick button{flex:0 0 auto;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700}
.scope{display:flex;gap:6px;margin-top:8px;font-size:13px}
.scope button{border:1px solid rgba(255,255,255,.3);background:transparent;color:#dfe3ee;border-radius:20px;padding:5px 11px}
.scope button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}

/* store tabs */
.stores{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.stores::-webkit-scrollbar{display:none}
.store{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;text-align:left;min-width:84px}
.store b{display:block;font-size:15px}
.store span{display:block;font-size:11px;color:var(--sub);margin-top:1px}
.store.on{background:var(--navy);border-color:var(--navy);color:#fff}
.store.on span{color:var(--gold)}
.parts{display:flex;gap:8px;padding:10px 16px}
.part{flex:1;border:0;border-radius:12px;padding:11px 0;font-weight:700;font-size:15px;background:#fff;border:1.5px solid var(--line)}
.part.on[data-p="전체"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.part.on[data-p="공통"]{background:var(--com);color:#fff;border-color:var(--com)}
.part.on[data-p="홀"]{background:var(--hall);color:#fff;border-color:var(--hall)}
.part.on[data-p="주방"]{background:var(--kit);color:#fff;border-color:var(--kit)}

/* list */
.sec{padding:6px 16px 0}
.sec h2{font-size:14px;color:var(--sub);font-weight:700;margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
.sec h2 .n{background:#e7e5de;border-radius:10px;padding:1px 8px;font-size:12px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin-bottom:9px;border:1px solid var(--line);width:100%;text-align:left}
.item:active{transform:scale(.99)}
.thumb{width:62px;height:62px;border-radius:12px;flex:0 0 62px;background:#eeece6 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:26px}
.item .t{font-weight:700;font-size:16px;line-height:1.35}
.item .d{font-size:13px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.bdg.홀{background:var(--hallbg);color:var(--hall)}
.bdg.주방{background:var(--kitbg);color:var(--kit)}
.bdg.공통{background:var(--combg);color:var(--com)}
.bdg.st{background:#efe9d8;color:#7a6020}
.bdg.lv{color:#fff}
.lv-하{background:#3d9a6a}.lv-중{background:#d08a1c}.lv-상{background:#c0392b}
.levels{display:flex;gap:6px;padding:0 16px 4px;align-items:center}
.levels .lbl{font-size:12px;font-weight:700;color:var(--sub);margin-right:2px;white-space:nowrap}
.lvl{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 0;font-size:13px;font-weight:700;white-space:nowrap}
.lvl.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lvl.on.lv-하,.lvl.on.lv-중,.lvl.on.lv-상{border-color:transparent;color:#fff}
.lvl.lv-하:not(.on){color:#3d9a6a;background:#fff}.lvl.lv-중:not(.on){color:#b5740e;background:#fff}.lvl.lv-상:not(.on){color:#c0392b;background:#fff}
.lvhead{font-size:12px;font-weight:700;margin:10px 4px 6px;display:flex;align-items:center;gap:6px;color:var(--sub)}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--sub);padding:40px 20px;font-size:15px;line-height:1.7}
.empty b{display:block;font-size:34px;margin-bottom:6px}

/* fab / bottom */
.fabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;max-width:720px;margin:0 auto;
  padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%)}

.fab{flex:1;border:0;border-radius:16px;padding:16px 10px;font-weight:900;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.fab.photo{background:var(--gold);color:var(--navy);flex:1.4}
.fab.text{background:var(--navy);color:#fff}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:4px 2px 10px}
.chk input{width:20px;height:20px}

/* sheet / modal */
.ov{position:fixed;inset:0;background:rgba(10,14,28,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 16px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 14px 10px;z-index:2;border-bottom:1px solid var(--line)}
.shead h3{flex:1;margin:0;font-size:18px;font-weight:900;line-height:1.3}
.x{border:0;background:#e3e1da;border-radius:12px;width:40px;height:40px;font-size:18px;flex:0 0 40px}
.sbody{padding:14px 16px}
.dimg{width:100%;border-radius:14px;margin-bottom:10px;display:block;background:#ddd}
.dcap{font-size:12px;color:var(--sub);margin:-6px 0 12px 4px}
.dcontent{background:#fff;border-radius:16px;padding:16px;font-size:16px;line-height:1.75;white-space:pre-wrap;border:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;color:var(--sub)}
.meta{font-size:12px;color:var(--sub);margin-top:12px}
.acts{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:14px;padding:15px 10px;font-weight:900;font-size:16px;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:#fff;color:#c0392b;border:1.5px solid #f0c9c4}

/* form */
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:0 0 6px 2px}
.f input[type=text],.f textarea,.f select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px;outline:none}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--navy)}
.f textarea{min-height:160px;resize:vertical;line-height:1.6}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hint{font-size:12px;color:var(--sub);margin:6px 2px 0;line-height:1.5}
.warn{background:#fff6dc;border:1px solid #f0d98a;color:#7a5a00;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px;display:none;line-height:1.5}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.im{position:relative;aspect-ratio:1;border-radius:12px;background:#ddd center/cover no-repeat}
.im button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:28px;height:28px;font-size:14px}
.im span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:3px 5px;border-radius:0 0 12px 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.addimg{display:flex;align-items:center;justify-content:center;gap:6px;border:2px dashed #cfccc2;border-radius:12px;padding:14px;font-weight:700;color:var(--sub);background:#fff}

/* dialog */
.dlg{background:#fff;border-radius:20px;width:calc(100% - 40px);max-width:360px;padding:22px;margin:auto;align-self:center;animation:up .18s ease}
.ov.center{align-items:center}
.dlg h4{margin:0 0 8px;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.6}
.pin{width:100%;font-size:26px;text-align:center;letter-spacing:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px;outline:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;z-index:90;opacity:0;transition:.25s;max-width:90%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.go{margin:8px 16px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.go .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.go .h b{font-size:15px}
.go .addr{font-size:13px;color:var(--sub);margin:4px 0 10px;line-height:1.5;word-break:keep-all}
.go .row{display:flex;gap:8px}
.go a{flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:11px 6px;font-weight:900;font-size:14px}
.go a.nv{background:#03c75a;color:#fff}
.go a.kk{background:#fee500;color:#191919}
.go .ed{border:0;background:#f0eee8;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--sub)}
.golist .go{margin:0 0 10px}
#goSheet .go{margin:0 0 10px}
/* ⚡ 빠른 공유 (운전 중 한 번 탭) */
.qbtn{background:var(--gold);color:var(--navy)}
#quickOv{position:fixed;inset:0;z-index:60;background:#0b1224;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}
#quickOv.show{display:flex}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qhead h3{flex:1;margin:0;color:#fff;font-size:24px;font-weight:900}
.qhead button{border:0;border-radius:16px;background:#26324f;color:#fff;font-size:18px;font-weight:900;padding:14px 18px}
.qgrid{flex:1;overflow:auto;display:grid;grid-template-columns:1fr;gap:12px;align-content:start}
.qtile{border:0;border-radius:22px;padding:22px 20px;text-align:left;color:#fff;display:flex;align-items:center;gap:14px;min-height:96px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.qtile:active{transform:translateY(3px);box-shadow:none;filter:brightness(1.15)}
.qtile .qi{font-size:36px;flex:0 0 auto}
.qtile b{display:block;font-size:24px;font-weight:900;line-height:1.25}
.qtile span{display:block;font-size:15px;opacity:.85;margin-top:4px}
.qtile.p-홀{background:#1f6b4c}.qtile.p-주방{background:#a8451a}.qtile.p-공통{background:#3a4a9e}
.qtile.done{outline:4px solid var(--gold)}
.qempty{color:#c9d0e2;text-align:center;font-size:17px;line-height:1.8;padding:40px 10px}
.qnote{color:#8e98b3;font-size:13px;text-align:center;margin-top:10px}
.pinBtn.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.tools{margin:22px 16px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.tools h2{margin:0 0 4px;font-size:15px}
.tools p{margin:0 0 12px;font-size:12px;color:var(--sub);line-height:1.6}
.tools .row{display:flex;gap:8px}
.tools .row button{flex:1;border:0;border-radius:12px;padding:13px 6px;font-size:14px;font-weight:900}
#expBtn{background:var(--navy);color:#fff}
#impBtn{background:var(--gold);color:var(--navy)}
#undoBtn{margin-top:8px;width:100%;border:1.5px dashed #cfccc2;background:transparent;border-radius:12px;padding:10px;font-size:13px;font-weight:700;color:var(--sub);display:none}
.bk{background:#f6f5f1;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;margin-bottom:12px}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.choice b{display:block;font-size:15px}
.choice span{font-size:12px;color:var(--sub);line-height:1.5}
.choice.main{border-color:var(--navy);background:#eef1f8}
.dlg .seg button{padding:9px 8px;font-size:13px}
.dlg .f{margin-bottom:10px}

/* ============================================================
   ART DIRECTION — 아이보리 종이 · 깊은 남색 · 금박 선
   조용하고 단정한 화면: 한 화면에 시선이 한 곳으로
   ============================================================ */
:root{
  --navy:#0e1628; --navy2:#1a2642; --gold:#b8924a; --gold2:#d9bf86;
  --bg:#f4efe4; --card:#fffcf5; --ink:#1c1b19; --sub:#7a7468; --line:#e5dcc8;
  --hall:#4f7a63; --hallbg:#e7efe8; --kit:#a95a36; --kitbg:#f5e6dc; --com:#46557f; --combg:#e6e9f1;
  --serif:'Noto Serif KR',serif;
}
body{
  background:
    radial-gradient(1200px 500px at 50% -120px, rgba(184,146,74,.10), transparent 70%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .18  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    var(--bg);
  letter-spacing:-.2px;
}

/* 머리 */
header{
  background:
    radial-gradient(600px 220px at 85% -40px, rgba(217,191,134,.18), transparent 70%),
    linear-gradient(180deg,#0e1628 0%,#15203a 100%);
  border-bottom:1px solid rgba(217,191,134,.45);
  box-shadow:0 10px 30px -18px rgba(14,22,40,.6);
  padding-bottom:14px;
}
.brand h1{font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:-.5px}
.brand h1 small{font-family:'Noto Sans KR';font-size:10px;letter-spacing:3.5px;color:var(--gold2);font-weight:500;margin-bottom:5px;opacity:.9}
.brand h1::after{content:"";display:block;width:28px;height:1px;background:var(--gold2);margin-top:8px;opacity:.8}
.hbtn{background:rgba(255,255,255,.06);border:1px solid rgba(217,191,134,.35);border-radius:999px;padding:9px 13px;font-weight:700}
.hbtn.qbtn{background:linear-gradient(180deg,#d9bf86,#b8924a);color:#0e1628;border:0;box-shadow:0 4px 14px -4px rgba(184,146,74,.7)}
.hbtn.on{background:var(--gold2);color:var(--navy)}
.search input{background:#fffcf5;border-radius:999px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);padding-top:15px;padding-bottom:15px}
.search input::placeholder{color:#a39b8b}
.quick button{background:transparent;border:1px solid rgba(217,191,134,.35);color:#efe6d2;font-weight:500}
.quick button:active{background:rgba(217,191,134,.18)}
.scope button{border-color:rgba(217,191,134,.35)}
.scope button.on{background:var(--gold2);border-color:var(--gold2);color:var(--navy)}

/* 매장 탭 */
.stores{padding-top:16px}
.store{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 16px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.store b{font-family:var(--serif);font-weight:700;font-size:16px}
.store span{font-size:11px;letter-spacing:.2px}
.store.on{background:var(--navy);border-color:var(--navy);box-shadow:0 8px 18px -10px rgba(14,22,40,.7);position:relative}
.store.on::after{content:"";position:absolute;left:16px;right:16px;bottom:7px;height:1px;background:var(--gold2);opacity:.7}
.store.on span{color:var(--gold2)}

/* 파트: 하나의 분절 컨트롤 */
.parts{margin:12px 16px 6px;padding:4px;gap:4px;background:#ebe4d4;border-radius:16px}
.part{border:0;background:transparent;border-radius:12px;padding:10px 0;color:#5c564b;font-weight:700}
.part.on{box-shadow:0 4px 12px -6px rgba(0,0,0,.4)}
.part.on[data-p="전체"]{background:var(--navy);color:#fff}

/* 신입교육 단계 */
.levels{padding:6px 16px 2px}
.levels .lbl{font-family:var(--serif);color:var(--ink);font-size:12px;letter-spacing:.5px}
.lvl{background:transparent!important;border:1px solid var(--line);font-weight:700}
.lvl.on{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)}
.lvl.on.lv-하{background:#4f7a63!important}.lvl.on.lv-중{background:#b07a24!important}.lvl.on.lv-상{background:#9e3b2c!important}
.lv-하{background:#4f7a63}.lv-중{background:#b07a24}.lv-상{background:#9e3b2c}

/* 섹션 제목: 세리프 + 금선 */
.sec h2{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:700;margin:22px 2px 10px}
.sec h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold) ,transparent);opacity:.55;margin-left:6px}
.sec h2 .n{background:transparent;border:1px solid var(--line);color:var(--sub);font-family:'Noto Sans KR'}
.lvhead{font-family:var(--serif);color:var(--ink);font-size:12px;margin:14px 4px 8px}

/* 교육 카드: 파트 색 세로선 */
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 16px;position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.02),0 10px 24px -20px rgba(60,45,20,.45);transition:transform .12s, box-shadow .12s}
.item::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--com)}
.item:has(.bdg.홀)::before{background:var(--hall)}

<script>
/* ===================== 설정 ===================== */
const ADMIN_PIN = '5324';
const STORES = [
  {id:'공통', name:'전체 공통', sub:'모든 매장'},
  {id:'구로', name:'구로', sub:'최우영스시'},
  {id:'여의도', name:'여의도', sub:'최우영스시야'},
  {id:'가산', name:'가산', sub:'최우영고기야'},
  {id:'영등포', name:'영등포', sub:'최우영수산'},
  {id:'종로', name:'종로', sub:'최우영씨푸드'},
];
const PARTS = ['전체','공통','홀','주방'];
const PART_ICON = {공통:'', 홀:'', 주방:''};   // 보석 아이콘(pIcon)으로 대체
/* ===================== 빛나는 보석 아이콘 (이모티콘 대신) ===================== */
const GEM_COLORS=[ // [이름, 밝은, 중간, 어두운]
  ['루비','#ffb3c1','#e0115f','#6e0429'],['사파이어','#a9c8ff','#2257e0','#0a1c5c'],['에메랄드','#a6f5cf','#0f9d63','#04452a'],
  ['자수정','#e2c4ff','#8a3fd1','#36106a'],['토파즈','#ffe7a3','#f0a81c','#7a4800'],['아쿠아마린','#c6f8ff','#2ec4dd','#0a5768'],
  ['로즈쿼츠','#ffd9e6','#f08ab4','#8e3560'],['시트린','#fff6b0','#e8c21a','#6b5600'],['페리도트','#e6ffad','#86c414','#365705'],
  ['가넷','#ffb0a3','#b3261e','#470906'],['다이아','#ffffff','#d5e8ff','#7890b0'],['탄자나이트','#d0c4ff','#5a45d6','#1d1060']];
const GEM_SHAPES=(()=>{
  const poly=(n,r=44,rot=-90,sy=1)=>Array.from({length:n},(_,i)=>{const a=(rot+i*360/n)*Math.PI/180;return [50+r*Math.cos(a),50+r*Math.sin(a)*sy]});
  const param=(f,n=18)=>Array.from({length:n},(_,i)=>f(i/n*Math.PI*2));
  return [
    poly(8,44,-112.5),                                                     // 라운드 브릴리언트
    [[30,8],[70,8],[88,26],[88,74],[70,92],[30,92],[12,74],[12,26]],        // 에메랄드 컷
    param(t=>{const x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return [50+x*2.6,46-y*2.6]}), // 하트
    param(t=>{const x=Math.sin(t)*(1-Math.cos(t))*0.55,y=-Math.cos(t);return [50+x*62,52-y*40]}), // 페어
    param(t=>[50+30*Math.cos(t),50+42*Math.sin(t)]),                                              // 오벌
    [[50,8],[92,84],[8,84]],                                                // 트릴리언
    [[24,34],[38,16],[62,16],[76,34],[50,88]],                              // 다이아몬드 옆모습
    poly(6,45,-90),                                                         // 헥사곤
  ];
})();
let gemSeq=0;
function gemSVG(color,shape,size=40,spark=true){
  const [ ,lt,md,dk]=GEM_COLORS[((color%12)+12)%12], P=GEM_SHAPES[((shape%8)+8)%8], id='g'+(++gemSeq);
  const cx=P.reduce((a,p)=>a+p[0],0)/P.length, cy=P.reduce((a,p)=>a+p[1],0)/P.length-4;
  const I=P.map(([x,y])=>[cx+(x-cx)*.52,cy+(y-cy)*.52]);
  const pts=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  let fac='';
  for(let i=0;i<P.length;i++){const j=(i+1)%P.length, up=((P[i][1]+P[j][1])/2)<cy;
    fac+=`<polygon points="${pts([P[i],P[j],I[j],I[i]])}" fill="${i%2?'#fff':'#000'}" opacity="${i%2?(up?.38:.16):(up?.05:.22)}"/>`;}
  const delay=(color*0.37+shape*0.53)%3;
  return `<svg class="gem" width="${size}" height="${size}" viewBox="0 0 100 100" style="--glow:${md}" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${lt}"/><stop offset=".5" stop-color="${md}"/><stop offset="1" stop-color="${dk}"/></linearGradient>
    <radialGradient id="${id}h" cx=".35" cy=".3" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <polygon points="${pts(P)}" fill="url(#${id})" stroke="${dk}" stroke-width="1.5" stroke-linejoin="round"/>
    ${fac}
    <polygon points="${pts(I)}" fill="${lt}" opacity=".55"/>
    <polygon points="${pts(I)}" fill="url(#${id}h)"/>
    <polygon points="${pts(P)}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>
    ${spark?`<path class="spk" style="animation-delay:${delay.toFixed(2)}s" d="M78 10 L81 19 L90 22 L81 25 L78 34 L75 25 L66 22 L75 19 Z" fill="#fff"/>`:''}
  </svg>`;
}
const gemOf=g=>gemSVG(g%12,(5*g+Math.floor(g/12))%8);   // 96가지 서로 다른 조합
const PART_GEM={공통:[1,0],홀:[2,1],주방:[0,2]};
const pIcon=()=>'';   // (버튼에는 보석 없음)
// 대제목 보석: 공통 사파이어 · 홀 아쿠아마린 · 주방 자수정 · 전체 매장 공통 다이아
const HEAD_GEM={공통:[1,0],홀:[5,1],주방:[3,7],전체:[10,6]};
const hGem=k=>{const g=HEAD_GEM[k]||[10,6];return gemSVG(g[0],g[1],22,true);};
// 상·중·하 보석: 하 에메랄드 · 중 토파즈 · 상 루비 (단계 색과 같은 계열)
const LV_GEM={하:[2,0],중:[4,1],상:[0,2]};
const lvGem=(l,sz=16)=>{const g=LV_GEM[l];return g?gemSVG(g[0],g[1],sz,false):'';};
const STORE_GEM={공통:[10,6],구로:[1,0],여의도:[5,4],가산:[0,2],영등포:[2,1],종로:[3,7]};
const sIcon=()=>'';  // 매장 보석 표시 안 함
const gi=()=>'';     // 버튼·창 보석 표시 안 함
function hydrateGems(root=document){ root.querySelectorAll('i[data-g]').forEach(el=>el.remove()); }

/* 신입교육 단계: 하(기초) → 중(실무) → 상(숙련) 순서로 배워요 */
const LEVELS = ['하','중','상'];
const LEVEL_NAME = {하:'하 · 기초', 중:'중 · 실무', 상:'상 · 숙련'};
const lvOrder = l => Math.max(0, LEVELS.indexOf(l||'하'));

const SEED = [
  {store:'공통',part:'공통',level:'하',title:'출근 후 기본 순서',tags:['출근','오픈','복장'],content:'1. 출근 체크 후 유니폼·앞치마·위생모 착용\n2. 손 씻기 (비누 30초)\n3. 오늘 예약·단체 확인\n4. 담당 파트 오픈 체크리스트 진행\n5. 매니저에게 준비 완료 보고'},
  {store:'공통',part:'공통',level:'하',title:'쓰레기 분리 정리',tags:['쓰레기','분리수거','마감'],content:'• 음식물 / 일반 / 재활용(캔·병·플라스틱·박스) 분리\n• 박스는 테이프 떼고 접어서 묶기\n• 음식물 통은 비운 뒤 물로 헹궈 제자리'},
  {store:'공통',part:'홀',level:'중',title:'포장 주문 응대',tags:['포장','테이크아웃'],content:'1. 메뉴·수량·픽업 시간 복창\n2. 성함·연락처 뒷자리 확인\n3. 주방에 픽업 시간 전달\n4. 포장 완료 후 영수증 부착, 이름 표시'},
    {store:'가산',part:'홀',level:'하',title:'테이블 세팅 기준',tags:['세팅','테이블','단체'],content:'• 자리마다 왼쪽: 앞접시 + 맥주잔 + 소주잔 (소주잔은 맥주잔 안에 겹쳐 놓기)\n• 오른쪽: 물티슈\n• 단체 세팅 시 밥통 개수를 주방에 전달\n• 부족한 반찬은 샐러드바에 채우기'},

/* ===================== 저장소 (IndexedDB, 실패 시 메모리) ===================== */
const DB = (()=>{
  let db=null, mem={items:new Map(), meta:new Map()};
  function open(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open('cwy-training',1);
        r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('meta')};
        r.onsuccess=()=>{db=r.result;res()};
        r.onerror=()=>res();
      }catch(e){res()}
    });
  }
  function tx(store,mode,fn){
    if(!db) return Promise.resolve(fn(null));
    return new Promise((res,rej)=>{
      try{
        const t=db.transaction(store,mode), s=t.objectStore(store);
        const out=fn(s); t.oncomplete=()=>res(out?out.result:undefined); t.onerror=()=>rej(t.error);
      }catch(e){rej(e)}
    });
  }
  return {
    open,
    all:()=> db? tx('items','readonly',s=>s.getAll()) : Promise.resolve([...mem.items.values()]),
    put:(it)=> db? tx('items','readwrite',s=>s.put(it)) : (mem.items.set(it.id,it),Promise.resolve()),
    del:(id)=> db? tx('items','readwrite',s=>s.delete(id)) : (mem.items.delete(id),Promise.resolve()),
    getMeta:(k)=> db? tx('meta','readonly',s=>s.get(k)) : Promise.resolve(mem.meta.get(k)),
    setMeta:(k,v)=> db? tx('meta','readwrite',s=>s.put(v,k)) : (mem.meta.set(k,v),Promise.resolve()),
  };
})();

/* 같은 매장 + 같은 파트 + 같은 제목 = 같은 파일 → 덮어쓰기 */
const norm = s => (s||'').replace(/\s+/g,' ').trim().toLowerCase();
const keyOf = (store,part,title) => `${store}|${part}|${norm(title)}`;

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===================== 초성 검색 ===================== */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const toCho = s => [...s].map(c=>{const k=c.charCodeAt(0)-44032;return (k>=0&&k<=11171)?CHO[Math.floor(k/588)]:c}).join('');
const isCho = s => /^[ㄱ-ㅎ\s]+$/.test(s);
function matches(it,query){
  const words=norm(query).split(' ').filter(Boolean);
  const hay=norm([it.title,it.content,(it.tags||[]).join(' '),it.store,it.part].join(' '));
  return words.every(w=> isCho(w) ? toCho(hay).replace(/\s/g,'').includes(w) : hay.includes(w));
}
function score(it,query){
  const w=norm(query); let s=0;
  if(norm(it.title).includes(w)) s+=10;
  if((it.tags||[]).some(t=>norm(t).includes(w))) s+=5;
  return s;
}
function hl(text,query){
  let out=esc(text);
  norm(query).split(' ').filter(w=>w&&!isCho(w)).forEach(w=>{
    const re=new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    out=out.replace(re,m=>`<mark>${m}</mark>`);
  });
  return out;
}

async function countShare(it){ try{ it.shares=(it.shares||0)+1; it.lastShared=Date.now(); await DB.put(it); }catch(_){} }
async function shareItem(it){
  const sName=(STORES.find(s=>s.id===it.store)||{}).name;
  const text=`[매장업무교육] ${sName} · ${it.part} · 신입 ${LEVEL_NAME[it.level||'하']}\n■ ${it.title}\n\n${it.content}${(it.tags||[]).length?'\n\n'+it.tags.map(t=>'#'+t).join(' '):''}`;
  try{
    if(navigator.share){
      const files=fileCache.get(it.id)||await prepFiles(it);
      if(files.length&&navigator.canShare&&navigator.canShare({files})) await navigator.share({title:it.title,text,files});
      else await navigator.share({title:it.title,text});
      countShare(it); return;
    }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  try{await navigator.clipboard.writeText(text);countShare(it);toast('내용을 복사했어요. 카톡에 붙여넣기 하세요.')}
  catch(e){toast('이 화면에서는 공유가 막혀 있어요. 홈 화면 앱으로 열어주세요.')}
}

// 사진 파일 이름에서 제목 자동 만들기 (IMG_1234 같은 이름은 제외)
function titleFromFile(name){
  const t=name.replace(/\.[^.]+$/,'').replace(/[_\-]+/g,' ').trim();
  return /^(img|dsc|pxl|photo|image|screenshot|kakaotalk|스크린샷|\d)/i.test(t)?'':t;

const fval=sel=>($(sel+' .on')||{}).dataset?.v;
function checkDup(){

  } else w.style.display='none';
}

  $('#imgs').innerHTML=draftImgs.map((im,i)=>`<div class="im" style="background-image:url('${im.data}')"><button data-rm="${i}">✕</button><span>${esc(im.name)}</span></div>`).join('');
  $('#imgs').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{draftImgs.splice(+b.dataset.rm,1);drawImgs()});

async function addImages(e){ const f=[...e.target.files]; e.target.value=''; await addFiles(f); }
async function addFiles(list){
  // 사진첩 순서(촬영/수정 시간) 기준 정렬
  const files=[...list].sort((a,b)=>a.lastModified-b.lastModified);
  if(!files.length) return;
  $('#addImg').textContent='⏳ 사진 넣는 중…';
  if(!$('#fTitle').value.trim()){const t=titleFromFile(files[0].name);if(t){$('#fTitle').value=t;checkDup()}}
  let over=0;
  for(const f of files){
    const data=await compress(f);
    const idx=draftImgs.findIndex(x=>norm(x.name)===norm(f.name));
    if(idx>=0){draftImgs[idx]={name:f.name,data};over++}   // 같은 이름 → 덮어쓰기
    else draftImgs.push({name:f.name,data});
  }
  $('#addImg').innerHTML=gi(10,0,20)+' 사진첩에서 사진 추가';
  drawImgs();
  if(over) toast(`같은 이름 사진 ${over}장을 덮어썼어요`);
  if(!$('#fTitle').value.trim()) $('#fTitle').focus();
}
function compress(file,max=1280,q=.82){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      let {width:w,height:h}=img; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',q));
    };img.onerror=()=>res(r.result);img.src=r.result};
    r.readAsDataURL(file);
  });
}
async function save(){
  const level=fval('#fLevel')||'하';
  const store=fval('#fStore'), part=fval('#fPart'), title=$('#fTitle').value.replace(/\s+/g,' ').trim();
  const content=$('#fContent').value.trim();
  const tags=$('#fTags').value.split(/[,，#]/).map(s=>s.trim()).filter(Boolean);
  if(!title){toast('제목을 입력하세요');$('#fTitle').focus();return}
  if(!content&&!draftImgs.length){toast('내용이나 사진을 넣어주세요');return}
  const id=keyOf(store,part,title);
  const overwrote = items.some(i=>i.id===id) && (!editing||editing.id!==id);
  if(editing && editing.id!==id) await DB.del(editing.id); // 이름/매장/파트 변경 시 예전 것 제거
  await DB.put({id,gem:(editing&&Number.isInteger(editing.gem))?editing.gem:(items.find(i=>i.id===id)||{}).gem,store,part,level,title,content,tags,images:draftImgs,updated:Date.now()});
  const wasEdit=!!editing, keep=!wasEdit&&$('#fKeep')&&$('#fKeep').checked;
  try{localStorage.setItem('cwy-tr-keep',keep?'1':'0')}catch(_){}
  lastStore=store; lastPart=part;
  curStore=store; if(curPart!=='전체') curPart=part;   // 저장한 매장 화면으로 이동
  await load();
  toast(overwrote?'같은 이름이 있어서 덮어썼어요':(wasEdit?'수정했어요':'저장했어요'));
  editing=null;
  if(keep) openForm(null); else hide('#formOv');
}

/* ===================== 백업 보내기 · 받기 (같은 파일명 고정) ===================== */
const BK_NAME='매장업무교육_백업.json';   // 항상 같은 이름 → 저장할 때 덮어쓰기
let dl=null; try{ if(window.claude&&claude.use) claude.use('downloads').then(x=>dl=x).catch(()=>{}) }catch(_){}
async function exportBackup(){
  const all=await DB.all();
  const json=JSON.stringify({app:'cwy-training',v:2,at:Date.now(),count:all.length,items:all,storeInfo},null,0);
  // 1) 휴대폰 공유창 (카톡·문자·메일 등으로 바로 보내기)
  try{
    const f=new File([json],BK_NAME,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'매장업무교육 백업'});toast(`교육 ${all.length}개 백업을 보냈어요`);return}
  }catch(e){if(e&&e.name==='AbortError')return}
  // 2) Claude 화면에서 파일 저장
  if(dl){
    try{await dl.save({filename:BK_NAME,data:new Blob([json],{type:'application/json'})});toast(`${BK_NAME} 저장 (교육 ${all.length}개)`);return}
    catch(e){if(e&&e.code==='declined')return}
  }
  // 3) 일반 브라우저 다운로드
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=BK_NAME;document.body.appendChild(a);a.click();a.remove();toast(`${BK_NAME} 저장 (교육 ${all.length}개)`)}
  catch(e){toast('이 화면에서는 보내기가 막혀 있어요. 홈 화면 앱에서 해주세요.')}
}
async function importBackup(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  let data;
  try{data=JSON.parse(await f.text())}catch(err){toast('백업 파일을 읽을 수 없어요');return}
  const list=(data.items||[]).filter(it=>it&&it.title&&it.store&&it.part).map(it=>{
    const o={...it,id:keyOf(it.store,it.part,it.title)}; if(!LEVELS.includes(o.level)) o.level='하'; return o;
  });
  if(!list.length){toast('백업 안에 교육이 없어요');return}
  const cur=await DB.all(), ids=new Set(cur.map(i=>i.id));
  const nNew=list.filter(i=>!ids.has(i.id)).length, nOver=list.length-nNew;
  const nGone=cur.filter(i=>!list.some(x=>x.id===i.id)).length;
  // 고르는 창 없이 바로 적용: 보낸 기기와 똑같이 맞춤 (불러온 내용이 가장 최신으로 저장됨)
  const now=Date.now();
  await DB.setMeta('undo',{at:now,items:cur,storeInfo});   // 되돌리기용 저장
  for(const i of cur) if(!list.some(x=>x.id===i.id)) await DB.del(i.id);
  for(const it of list) await DB.put({...it,updated:now});
  storeInfo=data.storeInfo||{}; await DB.setMeta('storeInfo',storeInfo);
  await load(); showUndo();
  toast(`불러오기 완료 · 교육 ${list.length}개 적용${nGone?` (빠진 교육 ${nGone}개)`:''}`);
}
async function showUndo(){ const u=await DB.getMeta('undo'); $('#undoBtn').style.display=u?'block':'none'; }
async function undoImport(){
  const u=await DB.getMeta('undo'); if(!u) return;
  dialog(`<h4>되돌릴까요?</h4><p>불러오기 전 상태(교육 ${u.items.length}개)로 돌아가요.</p>
    <div class="acts"><button class="btn ghost" data-dlg-close>취소</button><button class="btn" id="unOk">되돌리기</button></div>`);
  $('#unOk').onclick=async()=>{
    for(const i of await DB.all()) await DB.del(i.id);
    for(const i of u.items) await DB.put({...i,updated:Date.now()});

    hide('#dlgOv'); await load(); showUndo(); toast('불러오기 전으로 되돌렸어요');
  };
}

/* ===================== 시작 ===================== */
async function assignGems(list){
  const used=new Set(list.filter(i=>Number.isInteger(i.gem)).map(i=>i.gem)); let g=0;
  for(const it of list.filter(i=>!Number.isInteger(i.gem)).sort((a,b)=>a.id.localeCompare(b.id))){
    while(used.has(g)) g++; it.gem=g; used.add(g); await DB.put(it);
  }
}

/* ===================== ☁ 서버 저장 (Claude 링크로 열 때) =====================
   교육 내용을 서버에 저장 → 어느 기기·브라우저에서 열어도 같은 내용.
   이 기기에도 같이 저장(IndexedDB)해서 인터넷이 없을 때도 보임. 사진은 따로 저장. */
const SEED_MAP=(()=>{const m={};[...SEED,...SEED2,...SEED3,...SEED4].forEach(x=>{m[keyOf(x.store,x.part,x.title)]=x;});return m;})();
// 처음 들어있던 기본 교육을 손대지 않았으면 '아주 오래된 것'으로 취급 → 다른 기기에서 고친 내용을 덮어쓰지 않음
const eff=it=>{const sd=SEED_MAP[it.id];if(sd&&sd.content===it.content&&sd.title===it.title&&!(it.images&&it.images.length)&&(it.level||'하')===(sd.level||'하'))return 1;return it.updated||1;};
const Cloud=(()=>{
  let cdb=null,on=false,firstDone=false,ro=false,timer=null,chain=Promise.resolve(),running=false;const Q=new Map(),srvUpd=new Map();
  let upl=new Set();try{upl=new Set(JSON.parse(localStorage.getItem('cwy-tr-up')||'[]'))}catch(_){}
  const saveUpl=()=>{try{localStorage.setItem('cwy-tr-up',JSON.stringify([...upl].slice(-5000)))}catch(_){}};
  const h53=(str)=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);};
  const key=id=>'k'+h53(id)+'-'+id.length, imgKey=d=>'m'+h53(d)+'-'+d.length;
  function setStatus(st){const el=document.getElementById('cloudPill');if(!el)return;el.className='cloud '+st;
    el.textContent={local:'💾 이 기기에만 저장돼요 · 백업으로 옮기기',wait:'☁ 서버 연결 중…',ok:'☁ 서버에 저장됨 · 어느 기기에서나 같아요',ro:'☁ 보기 전용 (올리기는 이 기기에만)',err:'☁ 서버 연결 안 됨 · 이 기기에 저장 중'}[st]||'';}
  function shrink(d){if(!d||d.length<=200000)return Promise.resolve(d);return new Promise(res=>{const im=new Image();im.onload=()=>{let q=.72,max=1100,out=d;
    for(let k=0;k<8;k++){const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=200000)break;max=Math.round(max*.8);q=Math.max(.5,q-.06);}res(out);};im.onerror=()=>res(d);im.src=d;});}
  const body=it=>({id:it.id,store:it.store,part:it.part,level:it.level||'하',title:it.title,content:it.content||'',tags:it.tags||[],gem:Number.isInteger(it.gem)?it.gem:null,
    updated:eff(it),images:(it.images||[]).filter(x=>x.ref).map(x=>({name:x.name||'',ref:x.ref})),deleted:false});
  async function doPush(it){let changed=false;
    for(const im of (it.images||[])){if(!im.data)continue;if(!im.ref){im.ref=imgKey(im.data);changed=true;}
      if(!upl.has(im.ref)){await cdb.doc('imgs/'+im.ref).set({data:await shrink(im.data)});upl.add(im.ref);saveUpl();}}
    if(changed)await DB._put(it);
    await cdb.doc('items/'+key(it.id)).set(body(it));}
  async function doDel(id,refs){await cdb.doc('items/'+key(id)).set({id,deleted:true,updated:Date.now()});
    const used=new Set();(await DB.all()).forEach(i=>(i.images||[]).forEach(x=>x.ref&&used.add(x.ref)));
    for(const r of refs||[])if(!used.has(r)){try{await cdb.doc('imgs/'+r).delete();upl.delete(r);}catch(_){}}saveUpl();}
  async function run(){if(running||!on||ro||!firstDone)return;running=true; // 서버 내용을 먼저 받은 뒤에만 올림
    try{while(Q.size){const [k,job]=Q.entries().next().value;Q.delete(k);
      if(!job.del&&(srvUpd.get(job.it.id)||0)>=eff(job.it)&&!job.force)continue; // 서버가 같거나 더 새것이면 안 올림
      try{if(job.del)await doDel(job.id,job.refs);else{await doPush(job.it);srvUpd.set(job.it.id,eff(job.it));}}
      catch(e){const c=e&&e.code;if(c==='invalid_argument'&&!job.del&&!job.tried){job.tried=1;ro=true;setStatus('ro');}
        else if(c==='quota_exceeded'){toast('서버 저장 공간이 가득 찼어요. 오래된 사진을 지워 주세요');}
        else if(c==='unavailable'&&!job.tried){job.tried=1;Q.set(k,job);await new Promise(r=>setTimeout(r,1500+Math.random()*1500));}}}}
    finally{running=false;}}
  function push(it){if(!it||!it.id)return;Q.set(it.id,{it});if(on)run();}
  function del(id,refs){Q.set(id,{del:true,id,refs});if(on)run();else{try{const p=JSON.parse(localStorage.getItem('cwy-tr-pdel')||'[]');p.push({id,refs});localStorage.setItem('cwy-tr-pdel',JSON.stringify(p.slice(-200)))}catch(_){}}}
  async function pushInfo(){if(!on||ro)return;try{await cdb.doc('meta/storeInfo').set({info:storeInfo||{},updated:(await DB.getMeta('storeInfoU'))||Date.now()});}catch(_){}}
  async function apply(snap){const local=new Map((await DB.all()).map(i=>[i.id,i]));const seen=new Set();let changed=false;
    for(const ds of snap.docs){const d=ds.data();if(!d||!d.id)continue;seen.add(d.id);srvUpd.set(d.id,d.updated||0);const L=local.get(d.id);
      if(d.deleted){if(L&&eff(L)<=(d.updated||0)){await DB._del(d.id);changed=true;}continue;}
      if(!L||(d.updated||0)>eff(L)){const imgs=[];
        for(const r of (d.images||[])){const c=L&&(L.images||[]).find(x=>x.ref===r.ref&&x.data);if(c){imgs.push(c);continue;}
          try{const sn=await cdb.doc('imgs/'+r.ref).get();if(sn.exists){imgs.push({name:r.name,ref:r.ref,data:sn.data().data});upl.add(r.ref);}}catch(_){}}
        const it={...d,images:imgs};delete it.deleted;if(!Number.isInteger(it.gem))delete it.gem;await DB._put(it);changed=true;}
      else if(eff(L)>(d.updated||0))push(L);}
    if(!snap.metadata.fromCache){if(!firstDone){firstDone=true;for(const [id,L] of local)if(!seen.has(id))push(L);saveUpl();}clearTimeout(timer);setStatus(ro?'ro':'ok');}
    if(changed)await load();}
  async function start(){
    if(!(window.claude&&typeof claude.use==='function')){setStatus('local');return;}
    setStatus('wait');timer=setTimeout(()=>{if(!firstDone)setStatus('err')},10000);
    try{cdb=await claude.use('db');}catch(_){cdb=null;}
    if(!cdb){clearTimeout(timer);setStatus('local');return;}
    on=true;
    try{const p=JSON.parse(localStorage.getItem('cwy-tr-pdel')||'[]');p.forEach(x=>Q.set(x.id,{del:true,id:x.id,refs:x.refs}));localStorage.removeItem('cwy-tr-pdel');}catch(_){}
    cdb.collection('items').onSnapshot(snap=>{chain=chain.then(()=>apply(snap)).then(run).catch(()=>{});},e=>{clearTimeout(timer);setStatus(e&&e.code==='revoked'?'local':'err');});
    cdb.doc('meta/storeInfo').onSnapshot(async sn=>{if(!sn.exists){if(!sn.metadata.fromCache&&storeInfo&&Object.keys(storeInfo).length)pushInfo();return;}
      const d=sn.data(),lu=(await DB.getMeta('storeInfoU'))||0;
      if((d.updated||0)>lu){storeInfo=d.info||{};await DB._setMeta('storeInfo',storeInfo);await DB._setMeta('storeInfoU',d.updated);renderGo();}
      else if(lu>(d.updated||0))pushInfo();},()=>{});}
  function install(){ // 이 기기에 저장할 때 서버에도 저장
    DB._put=DB.put;DB._del=DB.del;DB._setMeta=DB.setMeta;
    DB.put=async it=>{await DB._put(it);push(it);};
    DB.del=async id=>{let it=items.find(i=>i.id===id);if(!it)it=(await DB.all()).find(i=>i.id===id);await DB._del(id);del(id,((it&&it.images)||[]).map(x=>x.ref).filter(Boolean));};
    DB.setMeta=async(k,v)=>{await DB._setMeta(k,v);if(k==='storeInfo'){await DB._setMeta('storeInfoU',Date.now());pushInfo();}};}
  return {start,install};
})();

async function load(){items=await DB.all();await assignGems(items);try{storeInfo=(await DB.getMeta('storeInfo'))||{}}catch(_){storeInfo={}}render()}
(async()=>{
  try{const s=localStorage.getItem('cwy-tr-store');if(s&&STORES.some(x=>x.id===s))curStore=s}catch(_){}
  hydrateGems();
  try{if(localStorage.getItem('cwy-tr-admin')==='1'){admin=true;document.body.classList.add('admin');$('#adminBtn').textContent='🔓';$('#adminBtn').classList.add('on')}}catch(_){}
  await DB.open();
  Cloud.install();
  if(!(await DB.getMeta('seeded'))){
    for(const s of SEED) await DB.put({...s,id:keyOf(s.store,s.part,s.title),images:[],updated:1});
    await DB.setMeta('seeded',true);
  }
  if(((await DB.getMeta('seedv'))||1) < 2){
    const all=await DB.all(), ids=new Set(all.map(i=>i.id));
    const oldFifo=all.find(i=>i.id==='공통|주방|선입선출 (fifo)');
    if(oldFifo && oldFifo.content.startsWith('• 새로 들어온 재료는 뒤로, 먼저 들어온')) await DB.del(oldFifo.id);
    for(const s of SEED2){const id=keyOf(s.store,s.part,s.title); if(!ids.has(id)) await DB.put({...s,id,images:[],updated:1})}
    await DB.setMeta('seedv',2);
  }
  if(((await DB.getMeta('seedv'))||1) < 3){
    const all=await DB.all(), ids=new Set(all.map(i=>i.id));
    const oldPhone=all.find(i=>i.id==='공통|공통|근무 중 휴대폰 사용 주의');
    if(oldPhone && oldPhone.content.startsWith('• 근무 중 개인 휴대폰 사용 금지')) await DB.del(oldPhone.id);
    for(const s of SEED3){const id=keyOf(s.store,s.part,s.title); if(!ids.has(id)) await DB.put({...s,id,images:[],updated:1})}
    await DB.setMeta('seedv',3);
  }
  if(((await DB.getMeta('seedv'))||1) < 4){
    const ids=new Set((await DB.all()).map(i=>i.id));
    for(const s of SEED4){const id=keyOf(s.store,s.part,s.title); if(!ids.has(id)) await DB.put({...s,id,images:[],updated:1})}
    await DB.setMeta('seedv',4);
  }
  await load(); showUndo();
  Cloud.start();
  // 홈 화면 앱(오프라인) 지원 — 링크 미리보기 화면에서는 조용히 건너뜀
  try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}) }catch(_){}
})();
</script>
